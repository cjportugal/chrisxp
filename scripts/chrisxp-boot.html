<!doctype html>
<!--
  Source for public/chrisxp-boot.png (the ChrisXP splash screen). Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=2032,1532 --virtual-time-budget=2000 \
    --screenshot=public/chrisxp-boot.png scripts/chrisxp-boot.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="splash" width="2032" height="1532"></canvas>
<script>
const W = 2032, H = 1532;
const canvas = document.getElementById('splash');
const ctx = canvas.getContext('2d');
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, t) => { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); };

// --- Sky: value-noise fBm clouds, rendered at quarter resolution and upscaled for softness.
function sky() {
  const sw = W / 4, sh = H / 4;
  const off = document.createElement('canvas'); off.width = sw; off.height = sh;
  const oc = off.getContext('2d');
  const img = oc.createImageData(sw, sh);
  let seed = 95;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const G = 64, grid = Array.from({ length: G * G }, rand);
  const at = (x, y) => grid[((y % G + G) % G) * G + ((x % G + G) % G)];
  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v);
  };
  const fbm = (x, y) => { let s = 0, a = .5; for (let o = 0; o < 6; o++) { s += a * noise(x, y); x *= 2.03; y *= 2.03; a *= .5; } return s; };
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const nx = x / sw * 3.4, ny = y / sh * 2.6;
    const warp = fbm(nx * .6 + 11, ny * .6 + 3);
    const n = fbm(nx + warp * 1.1, ny + warp * .8) * .75 + fbm(nx * .45 + 40, ny * .45 + 7) * .35;
    // Thin the clouds behind the wordmark so the white "XP" keeps its contrast.
    const dx = (x * 4 - 1016) / 760, dy = (y * 4 - 1170) / 230;
    const cloud = smooth(.40, .70, n) * .94 * (1 - .8 * Math.exp(-(dx * dx + dy * dy)));
    const t = y / sh;
    const base = [lerp(78, 112, t), lerp(152, 178, t), lerp(222, 232, t)];
    const i = (y * sw + x) * 4;
    for (let c = 0; c < 3; c++) img.data[i + c] = lerp(base[c], 252, cloud);
    img.data[i + 3] = 255;
  }
  oc.putImageData(img, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off, 0, 0, W, H);
}

// --- Flag: every shape is a patch of one waving surface, so the frame is a single unbroken piece.
const TL = [1040, 400];
function map(u, v) {
  const wave = 226 * u * u * u - 114 * u * u;
  return [TL[0] + 414 * u - 196 * v, TL[1] + 491 * v + wave + 28 * u * v];
}
function patch(c, u0, v0, u1, v1, fill) {
  const steps = 24, pts = [];
  for (let i = 0; i <= steps; i++) pts.push(map(lerp(u0, u1, i / steps), v0));
  for (let i = 0; i <= steps; i++) pts.push(map(u1, lerp(v0, v1, i / steps)));
  for (let i = 0; i <= steps; i++) pts.push(map(lerp(u1, u0, i / steps), v1));
  for (let i = 0; i <= steps; i++) pts.push(map(u0, lerp(v1, v0, i / steps)));
  c.beginPath();
  pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
  c.closePath();
  c.fillStyle = fill;
  c.fill();
}
function pane(c, u0, v0, u1, v1, color, light) {
  const [ax, ay] = map(u0, v0), [bx, by] = map(u1, v1);
  const g = c.createLinearGradient(ax, ay, bx, by);
  g.addColorStop(0, light); g.addColorStop(.55, color); g.addColorStop(1, color);
  patch(c, u0, v0, u1, v1, g);
}

function flag() {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const c = off.getContext('2d');
  const K = '#0a0a0a', O = '#ff6a1c', B = '#1d7fe0';

  // Trailing squares: alternating black and colored columns that shrink and thin out to the left.
  const ROWS = 8, COL = .118;
  const colored = ['K', 'O', 'O', 'O', 'B', 'B', 'B', 'K'];
  const sparse = [[], [], [], [], [0, 7], [0, 4, 7], [0, 1, 3, 6, 7]];
  for (let col = 1; col <= 6; col++) {
    const scale = 1 - col * .075;
    const uc = -(col - .5) * COL;
    for (let r = 0; r < ROWS; r++) {
      if (sparse[col].includes(r)) continue;
      const kind = col % 2 ? 'K' : colored[r];
      const vc = (r + .5) / ROWS;
      const hu = COL * .42 * scale, hv = .5 / ROWS * .8 * scale;
      patch(c, uc - hu, vc - hv, uc + hu, vc + hv, kind === 'O' ? O : kind === 'B' ? B : K);
    }
  }

  // Frame and the four panes.
  patch(c, 0, 0, 1, 1, K);
  const uA = .1, uB = .47, uC = .56, uD = .9, vA = .1, vB = .46, vC = .54, vD = .9;
  pane(c, uA, vA, uB, vB, '#ff641e', '#ff9a5a');
  pane(c, uC, vA, uD, vB, '#5fbf26', '#93dc5e');
  pane(c, uA, vC, uB, vD, '#1f80e2', '#62aef2');
  pane(c, uC, vC, uD, vD, '#ffc015', '#ffdc6a');

  ctx.save();
  ctx.shadowColor = 'rgba(10, 40, 90, .38)';
  ctx.shadowBlur = 26;
  ctx.shadowOffsetX = 22;
  ctx.shadowOffsetY = 26;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

// --- Wordmark: heavy black "Chris" beside a hairline white "XP".
function wordmark() {
  const baseline = 1300, size = 312;
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${size}px "Arial Black"`;
  ctx.letterSpacing = '-14px';
  const chris = ctx.measureText('Chris').width;
  ctx.font = `200 ${size}px "Helvetica Neue"`;
  ctx.letterSpacing = '-4px';
  const xp = ctx.measureText('XP').width;
  const gap = 18, x = (W - chris - gap - xp) / 2;
  ctx.fillStyle = '#000';
  ctx.font = `${size}px "Arial Black"`;
  ctx.letterSpacing = '-14px';
  ctx.fillText('Chris', x, baseline);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(20, 60, 120, .3)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetX = 4;
  ctx.shadowOffsetY = 6;
  ctx.font = `200 ${size}px "Helvetica Neue"`;
  ctx.letterSpacing = '-4px';
  ctx.fillText('XP', x + chris + gap, baseline);
  ctx.shadowColor = 'transparent';
}

// --- 1995 treatment: drop to a low-res, reduced-palette bitmap, crush it through JPEG, blow it back up.
async function crunch() {
  const LOW = 4, lw = Math.round(W / LOW), lh = Math.round(H / LOW);
  const low = document.createElement('canvas'); low.width = lw; low.height = lh;
  const lc = low.getContext('2d');
  lc.imageSmoothingQuality = 'high';
  lc.drawImage(canvas, 0, 0, lw, lh);
  const img = lc.getImageData(0, 0, lw, lh);
  // 5 bits per channel, with a little ordered dither so the sky bands like an old VGA bitmap.
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
    const i = (y * lw + x) * 4, d = (bayer[(y % 4) * 4 + x % 4] / 16 - .5) * 8;
    for (let c = 0; c < 3; c++) img.data[i + c] = Math.min(255, Math.max(0, Math.round((img.data[i + c] + d) / 8) * 8));
  }
  lc.putImageData(img, 0, 0);
  const jpeg = new Image();
  jpeg.src = low.toDataURL('image/jpeg', .6);
  await jpeg.decode();
  lc.drawImage(jpeg, 0, 0);
  // Replicate pixels by hand; headless Chrome still filters drawImage with smoothing disabled.
  const src = lc.getImageData(0, 0, lw, lh).data, out = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const s = (Math.min(lh - 1, Math.floor(y / LOW)) * lw + Math.min(lw - 1, Math.floor(x / LOW))) * 4, o = (y * W + x) * 4;
    out.data[o] = src[s]; out.data[o + 1] = src[s + 1]; out.data[o + 2] = src[s + 2]; out.data[o + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}

document.fonts.load('312px "Arial Black"').then(() => document.fonts.load('200 312px "Helvetica Neue"')).finally(async () => {
  sky();
  flag();
  wordmark();
  await crunch();
});
</script>
</body>
</html>
